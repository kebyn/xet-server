name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run all tests
        run: cargo test --workspace --all-targets
      - name: Run documentation tests
        run: cargo test --workspace --doc

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # cargo-audit 0.22 is required for current CVSS 4.0 advisories; it only
      # reads Cargo.lock, so the pinned workspace toolchain is sufficient.
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit
      - name: Check audited exception versions
        run: python3 scripts/check-audit-exemptions.py --lockfile Cargo.lock

  msrv:
    name: Verify declared MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the working toolchain (currently 1.94.1, equal
      # to the declared rust-version). This job deliberately bypasses the pin
      # with an explicit +1.94.1 so a future toolchain bump cannot silently
      # break code that still claims to build on the declared MSRV.
      - name: Install declared MSRV toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Check on declared MSRV
        run: cargo +1.94.1 check --workspace --all-targets

  coverage:
    name: Test coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info
      - name: Summarize coverage
        run: |
          python3 - <<'EOF'
          import os

          lines_hit, lines_found = 0, 0
          with open('lcov.info') as f:
              for line in f:
                  if line.startswith('LH:'):
                      lines_hit += int(line[3:])
                  elif line.startswith('LF:'):
                      lines_found += int(line[3:])
          pct = 100.0 * lines_hit / lines_found if lines_found else 0.0
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f'## Test coverage\n\n')
              out.write(f'Total line coverage: **{pct:.2f}%** ({lines_hit}/{lines_found} lines)\n')
          EOF
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
