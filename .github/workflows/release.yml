name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build and publish release (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build release binaries
        run: cargo build --release
      - name: Package binaries
        run: |
          mkdir -p dist
          tar -czf "dist/xet-server-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" \
            -C target/release xet-server hub-api
          cd dist && sha256sum *.tar.gz > SHA256SUMS.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
