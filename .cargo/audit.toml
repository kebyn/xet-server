# cargo-audit configuration
#
# RUSTSEC-2026-0258 — h2 unbounded empty DATA frames (memory-exhaustion DoS).
#
# The lockfile contains h2 v0.3.27 through actix-http. The fixed h2 0.4 line
# is v0.4.19. Both production listeners use ordinary HttpServer::bind(), which
# accepts HTTP/1.x only; they do not enable H2C or TLS HTTP/2. This exception is
# therefore limited to the evaluated h2 0.3.27 dependency. It is not justified
# by request rate limiting: the advisory concerns connection-level frame
# handling, and rate limiting does not bound that memory growth.
#
# Re-evaluate and remove this entry if H2C, TLS HTTP/2, or another h2 usage path
# is enabled, or if the actix/http dependency graph changes. The CI audit guard
# checks the unignored advisory report and permits only h2 v0.3.27.
[advisories]
ignore = ["RUSTSEC-2026-0258"]
