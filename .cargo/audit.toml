# cargo-audit configuration
#
# RUSTSEC-2023-0071 — rsa "Marvin Attack" (timing sidechannel key recovery).
# Ignored because it is NOT reachable in this project:
#
#   1. The `rsa` crate is never compiled into either binary. It is a
#      lockfile-only phantom dependency, pulled transitively as
#      sqlx-macros-core -> sqlx-mysql -> rsa. sqlx-macros-core unconditionally
#      lists every driver crate for its compile-time query checks, but this hub
#      enables only the SQLite driver, so sqlx-mysql (and rsa) is never activated
#      in the build graph. `cargo tree -p hub-api -i rsa` reports it absent.
#   2. The codebase performs no RSA operations anywhere; all asymmetric crypto is
#      Ed25519 (ed25519-dalek). The Marvin attack targets RSA decryption/signing
#      timing — a code path that does not exist here.
#   3. No fixed version of `rsa` is published upstream (Solution: "No fixed
#      upgrade is available").
#
# Re-evaluate (and remove this entry) if a future sqlx release stops listing
# sqlx-mysql as an unconditional dependency of sqlx-macros-core, which would let
# the phantom drop out of Cargo.lock entirely.
#
# RUSTSEC-2026-0258 — h2 "unbounded empty DATA frames" (memory-exhaustion DoS).
# Ignored for the h2 0.3 line only; the fixed 0.4 line in this lockfile has
# been upgraded past the advisory (h2 0.4.19 >= 0.4.16):
#
#   1. The remaining vulnerable copy is h2 v0.3.27, pulled exclusively by
#      actix-http 3.11.2 (actix-web 4.12.1 / actix-governor 0.5.0) — the
#      server-side HTTP/2 stack of both binaries. `cargo tree -i h2@0.3.27`
#      confirms no other path reaches it.
#   2. No fixed 0.3-series release exists: the upstream fix landed in
#      h2 0.4.16+, and actix-http 3.x has not migrated to the 0.4 line.
#      The MSRV policy (Rust 1.85) additionally forbids forcing a
#      cross-major upgrade through the dependency graph.
#   3. Mitigation: both servers front HTTP/2 with actix-governor rate
#      limiting (per-peer-IP request caps), bounding the rate at which an
#      unauthenticated peer can mount the empty-DATA-frame exhaustion.
#
# Re-evaluate (and remove this entry) when actix-http publishes an h2 0.4
# migration or backports the frame bound to the 0.3 line.
[advisories]
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0258"]
